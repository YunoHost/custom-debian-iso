menu hshift 11
menu width 70

menu title YunoHost installer

menu background splash.png

# Accessible dark theme from debian
menu color title	* #FFFFFFFF *
menu color border	* #00000000 #00000000 none
menu color unsel	* #ffffffff #ff000000 *
menu color hotkey	* #ffdddd00 #ff000000 *
menu color sel		* #ffffffff #ff808080 *
menu color hotsel	* #ffdddd00 #ff808080 *
menu color tabmsg	* #ffffffff #00000000 *
menu color help		37;40 #ffdddd00 #00000000 none
# XXX When adjusting vshift, take care that rows is set to a small
# enough value so any possible menu will fit on the screen,
# rather than falling off the bottom.
menu vshift 8
menu rows 12
# The help line must be at least one line from the bottom.
menu helpmsgrow 14
# The command line must be at least one line from the help line.
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg Press ENTER to boot or TAB to edit a menu entry

default installgui
label installgui
	menu label ^Graphical install (recommended)
	menu default
	kernel /install.__ARCH__/vmlinuz
	append  preseed/file=/cdrom/preseeds/default.preseed video=vesa:ywrap,mtrr vga=788 initrd=/install.__ARCH__/gtk/initrd.gz -- quiet
label install
	menu label ^Accessible high contrast text install
	kernel /install.__ARCH__/vmlinuz
	append  preseed/file=/cdrom/preseeds/default.preseed vga=788 initrd=/install.__ARCH__/initrd.gz theme=dark -- quiet
label rescue
	menu label ^Rescue mode
	kernel /install.__ARCH__/vmlinuz
	append vga=788 initrd=/install.__ARCH__/initrd.gz theme=dark rescue/enable=true --- quiet 
label help
	menu label ^Help
	text help
   Display help screens; type 'menu' at boot prompt to return to this menu
	endtext
	config prompt.cfg
label installspk
	menu label Install with ^speech synthesis
	kernel /install.__ARCH__/vmlinuz
	append preseed/file=/cdrom/preseeds/default.preseed vga=788 initrd=/install.__ARCH__/gtk/initrd.gz speakup.synth=soft --- quiet
# timeout to speech-enabled install
timeout 300
ontimeout /install.__ARCH__/vmlinuz preseed/file=/cdrom/preseeds/default.preseed vga=788 initrd=/install.__ARCH__/gtk/initrd.gz  theme=dark speakup.synth=soft --- quiet
menu autoboot Press a key, otherwise speech synthesis will be started in # second{,s}...
